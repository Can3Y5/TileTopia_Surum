name: Build EXE & APK and Release to TileTopia_Surum

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak Sürüm (Örn: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # =========================================================================
  # 1. WINDOWS STANDALONE EXE DERLEMESİ
  # =========================================================================
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout TileTopia Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Windows Portable EXE
        run: |
          npx electron-builder --win portable --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename Output EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "dist/TileTopia.exe" -Force
          }

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileTopia-Windows-EXE
          path: dist/TileTopia.exe

  # =========================================================================
  # 2. ANDROID NATIVE APK DERLEMESİ (Capacitor)
  # =========================================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TileTopia Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js version.json www/ || true
          cp -r css js libs www/

      - name: Install Dependencies
        run: |
          npm install

      - name: Setup Capacitor & Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Locate & Copy APK
        run: |
          find android -name "*.apk" -exec cp {} ./TileTopia.apk \;
          ls -la ./TileTopia.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TileTopia-Android-APK
          path: TileTopia.apk

  # =========================================================================
  # 3. Can3Y5/TileTopia_Surum REPOSUNA YAYINLAMA
  # =========================================================================
  release:
    name: Release to TileTopia_Surum
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows EXE
        uses: actions/download-artifact@v4
        with:
          name: TileTopia-Windows-EXE
          path: release_files

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: TileTopia-Android-APK
          path: release_files

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "TAG=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release in TileTopia_Surum
        uses: softprops/action-gh-release@v2
        with:
          repository: Can3Y5/TileTopia_Surum
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: TileTopia ${{ steps.get_version.outputs.TAG }}
          body: |
            ## 🎮 TileTopia Resmi Sürüm (${{ steps.get_version.outputs.TAG }})
            
            Tam teşekküllü **The Battle of Polytopia** 3D strateji oyunu!
            
            ### 📦 İndirilebilir Paketler:
            - 🖥️ **Windows EXE**: `TileTopia.exe` (Kurulum gerektirmeyen taşınabilir sürüm)
            - 📱 **Android APK**: `TileTopia.apk` (Android telefon ve tabletler için kurulum dosyası)
            
            ### ✨ Özellikler:
            - 12 Orijinal Kabile (Xin-xi, Imperius, Bardur, Oumaji, Kickoo, Hoodrick, Luxidoor, Vengir, Zebasi, Ai-Mo, Quetzali, Yădakk)
            - 5 Kollu Radyal Teknoloji Ağacı (Dairesel Tech Tree)
            - 3D Düşük Poligonlu Uzayda Yüzen Ada Haritası & Sis (Fog of War)
            - Yapay Zeka (AI Botlar) & Şehir Seviyelendirme Sistemi
            - Otomatik Güncelleme Sistemi (Oyun içi "Güncellemeleri Denetle" desteği)
          files: |
            release_files/TileTopia.exe
            release_files/TileTopia.apk
          draft: false
          prerelease: false
